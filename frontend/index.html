<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Image Generator</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;background:#f4f6fb;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;}
.container{background:white;padding:30px;border-radius:10px;box-shadow:0 10px 20px rgba(0,0,0,0.1);width:420px;text-align:center;}
textarea{width:100%;height:120px;padding:10px;border-radius:6px;border:1px solid #ccc;resize:none;font-size:14px;box-sizing:border-box;}
button{margin-top:15px;width:100%;padding:12px;border:none;background:#4a6cf7;color:white;font-size:16px;border-radius:6px;cursor:pointer;}
button:hover{background:#3754d5;}
#status{margin-top:15px;font-size:14px;color:#555;}
#imageContainer{margin-top:20px;display:none;}
img{max-width:100%;border-radius:8px;}
</style>
</head>
<body>
<div class="container">
<h2>AI Image Generator</h2>
<textarea id="prompt" placeholder="Describe the image you want..."></textarea>
<button onclick="generateImage()">Generate Image</button>
<div id="status">Ready</div>
<div id="imageContainer"><img id="generatedImage"></div>
</div>
<script>
const API_URL="YOUR_API_GATEWAY_URL";
async function generateImage(){
const prompt=document.getElementById("prompt").value.trim();
if(prompt===""){document.getElementById("status").innerText="Please enter a prompt";return;}
document.getElementById("status").innerText="Generating image...";
document.getElementById("imageContainer").style.display="none";
try{
await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:prompt})});
document.getElementById("status").innerText="Processing... please wait";
setTimeout(fetchImage,12000);
}catch(error){document.getElementById("status").innerText="Error calling API";}
}
async function fetchImage(){
try{
const response=await fetch(API_URL);
const data=await response.json();
const imageUrl=data.image_url || data.image;
if(!imageUrl){document.getElementById("status").innerText="Image not ready yet";return;}
document.getElementById("generatedImage").src=imageUrl;
document.getElementById("imageContainer").style.display="block";
document.getElementById("status").innerText="Image generated successfully";
}catch(error){document.getElementById("status").innerText="Error fetching image";}
}
</script>
</body>
</html>
